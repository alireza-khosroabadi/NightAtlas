[versions]
agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
navigation = "2.10.2"

hilt = "2.60.1"
ksp = "2.3.12"

[plugins]
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
hilt-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version = "1.3.0" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
sheets = { module = "androidx.compose.material:material-navigation" }
material3 = { module = "androidx.compose.material3:material3" }
navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.12.0" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.11.0" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.11.0" }
junit = { module = "junit:junit", version = "4.13.2" }
ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
android-test-ext = { module = "androidx.test.ext:junit", version = "1.3.0" }
android-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
